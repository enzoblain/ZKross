[package]
name = "zkross-prover-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "zkross-prover for the browser (wasm-bindgen); built by scripts/build/prover-wasm.sh"

# Standalone, like zkross-prover.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zkross-prover = { path = ".." }
# SPP pins this version (sdk/web/scripts/build.sh); the CLI must match.
wasm-bindgen = "=0.2.128"
anyhow = "1"
serde_json = "1"

[patch.crates-io]
cranelift-control = { path = "../../spp/vendor/cranelift-control" }

[profile.release]
lto = true
