[package]
name = "zkross-prover"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Builds circuit inputs and Groth16 proofs for ZKross (SPP transact, bridge_out, bridge_in)"

# Standalone: not a member of SPP's workspace.
[workspace]

[dependencies]
stellar-private-payments = { path = "../spp/sdk/native" }
circuits = { path = "../spp/circuits", default-features = false }
taceo-poseidon2 = { version = "0.3", default-features = false, features = ["bn254", "t2", "t3", "t4"] }
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
# Note delivery, the same crates and construction as SPP's sdk (zk/encryption.rs).
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "salsa20"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.11.0", default-features = false }
getrandom = { version = "0.2", default-features = false, features = ["js"] }

# Same patch SPP's workspace applies.
[patch.crates-io]
cranelift-control = { path = "../spp/vendor/cranelift-control" }
