[package]
name = "spp-poseidon2-vectors"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of SPP's workspace.
[workspace]

[dependencies]
soroban-utils = { path = "../stellar-private-payments/contracts/soroban-utils" }
soroban-sdk = { version = "=28.0.0", features = ["hazmat", "testutils"] }
taceo-poseidon2 = { version = "0.3", default-features = false, features = ["bn254", "t2", "t3", "t4"] }
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
num-bigint = "0.4"
serde_json = "1"

# Same patch SPP's workspace applies.
[patch.crates-io]
cranelift-control = { path = "../stellar-private-payments/vendor/cranelift-control" }
