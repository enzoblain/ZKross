# Updates the bridge service on the VM (set up once with
# scripts/deploy/server-setup.sh) on every push to main that touches it.
# The testnet keys stay in the VM's .env; GitHub only holds an SSH key.
# Repository settings → Secrets and variables → Actions:
#   secrets:   VM_SSH_KEY (a key dedicated to deploys), VM_KNOWN_HOSTS (lines
#              "<VM_HOST> <key type> <key>", so the VM's identity is checked;
#              without it the key the VM presents is trusted, with a warning)
#   variables: VM_HOST, VM_USER (e.g. ubuntu), VM_REPO_DIR (default: ZKross,
#              relative to the user's home)
name: Deploy service

on:
  push:
    branches: [main]
    paths:
      - services/bridge/**
      - apps/frontend/src/lib/abi/**
      - deployments.json
      - package.json
      - package-lock.json
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

concurrency:
  group: deploy-service
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      VM_REPO_DIR: ${{ vars.VM_REPO_DIR || 'ZKross' }}
    steps:
      - name: Check the configuration
        env:
          HAS_KEY: ${{ secrets.VM_SSH_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ] || [ -z "$VM_HOST" ] || [ -z "$VM_USER" ]; then
            echo "::error::Set the VM_SSH_KEY secret and the VM_HOST and VM_USER variables."; exit 1
          fi
      - name: SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Secrets pasted from Windows carry \r line endings, which SSH cannot read.
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//' | grep -v '^$' > ~/.ssh/known_hosts || true
          # Hosts and fingerprints are public: show them, for diagnosis.
          echo "VM_KNOWN_HOSTS: $(wc -l < ~/.ssh/known_hosts) line(s), for host(s): $(cut -d' ' -f1 ~/.ssh/known_hosts | sort -u | paste -sd' ' -)"
          if ssh-keygen -F "$VM_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "Trusted host keys for $VM_HOST:"
            ssh-keygen -F "$VM_HOST" -f ~/.ssh/known_hosts -l | grep -v '^#'
          else
            # Fallback: trust what the VM presents now, and show its fingerprint
            # (compare it with: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub on the VM).
            ssh-keyscan -t ed25519 "$VM_HOST" 2>/dev/null > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "::error::Cannot reach $VM_HOST on port 22."; exit 1; }
            echo "::warning::VM_KNOWN_HOSTS has no line for $VM_HOST; trusting the key it presents: $(ssh-keygen -lf ~/.ssh/known_hosts | cut -d' ' -f2). Fix the secret (lines starting with $VM_HOST) to check it."
          fi
      - name: Pull, install and restart
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" bash -s -- "$VM_REPO_DIR" "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          systemctl cat zkross-bridge >/dev/null 2>&1 ||
            { echo "The service is not installed on this VM yet: run bash scripts/deploy/server-setup.sh <site origin> there once." >&2; exit 1; }
          cd "$1"
          git fetch -q origin main
          git checkout -q main
          git merge -q --ff-only origin/main
          [ "$(git rev-parse HEAD)" = "$2" ] || echo "note: the VM is at $(git rev-parse --short HEAD), main moved on since this run started"
          npm ci --silent
          sudo systemctl restart zkross-bridge
          if systemctl cat zkross-refund-attester >/dev/null 2>&1; then
            sudo systemctl restart zkross-refund-attester
          fi
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/health >/dev/null 2>&1 && { echo "relayer is up"; exit 0; }
            sleep 2
          done
          echo "the relayer did not come back: journalctl -u zkross-bridge -n 50" >&2
          exit 1
          EOF
