[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
# Needed for ShieldedPool (unrolled Poseidon2) to stay under the EIP-170 size limit.
optimizer = true
optimizer_runs = 200
# Proof and hash fixtures exported from SPP.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
